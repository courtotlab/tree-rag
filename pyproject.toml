[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treerag"
version = "0.1.0"
description = "Budgeted LLM navigation over native organizational document hierarchies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "Arjun Sharma"},
  {name = "Jochen Weile"},
  {name = "Kayla Marsh"},
  {name = "Mélanie Courtot"},
]
dependencies = [
  "loguru>=0.7",
  "ollama>=0.5",
]

[project.optional-dependencies]
build = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pymupdf>=1.26",
  "pymupdf4llm>=0.0.27",
  "python-docx>=1.2",
  "rank-bm25>=0.2.2",
  "tqdm>=4.67",
]
test = ["pytest>=8.0"]

[dependency-groups]
demo = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pymupdf>=1.26",
  "pymupdf4llm>=0.0.27",
  "python-docx>=1.2",
  "rank-bm25>=0.2.2",
  "tqdm>=4.67",
]
test = ["pytest>=8.0"]

[tool.uv]
default-groups = ["demo", "test"]

[project.scripts]
treerag = "treerag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
